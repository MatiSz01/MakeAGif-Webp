# Build MakeAGIF for macOS Apple Silicon → DMG + GitHub Release
#
# Download (after success):
#   https://github.com/MatiSz01/MakeAGif-Webp/releases/download/v3.1.11-macos/MakeAGIF-v3.1.11-macOS-arm64.dmg

name: Build MakeAGIF (macOS)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "V3/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

env:
  APP_VERSION: "3.1.11"
  RELEASE_TAG: "v3.1.11-macos"
  V3_DIR: V3
  DMG_NAME: MakeAGIF-v3.1.11-macOS-arm64.dmg
  MAC_SPEC: MakeAGIF_v3.1.11_mac.spec

jobs:
  build-macos-arm64:
    name: macOS Apple Silicon (.app)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ${{ env.V3_DIR }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bundle CLI tools (parity with Windows tools/)
        run: |
          chmod +x ci_bundle_mac_tools.sh
          ./ci_bundle_mac_tools.sh

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pillow

      - name: Prepare icons (placeholder if not in repo)
        run: |
          python3 << 'PY'
          from pathlib import Path
          if Path("MakeAGIF.ico").exists():
              print("MakeAGIF.ico already present")
          else:
              from PIL import Image, ImageDraw
              im = Image.new("RGBA", (256, 256), (37, 160, 255, 255))
              d = ImageDraw.Draw(im)
              d.rounded_rectangle([32, 32, 224, 224], radius=40, fill=(20, 20, 30, 255))
              im.save("MakeAGIF.ico", format="ICO", sizes=[(256, 256), (48, 48), (32, 32), (16, 16)])
              im.resize((512, 512), Image.LANCZOS).save("icon_512.png")
              print("Created placeholder MakeAGIF.ico + icon_512.png")
          PY
          chmod +x _make_icns_mac.sh
          ./_make_icns_mac.sh || true

      - name: Build .app with PyInstaller
        run: python -m PyInstaller --noconfirm ${{ env.MAC_SPEC }}

      - name: Add macOS install extras
        run: |
          cp -R ../macos_extras/. dist/
          chmod +x "dist/Open MakeAGIF (first run).command"

      - name: Create DMG
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          APP="MakeAGIF v${APP_VERSION}.app"
          cp -R "dist/${APP}" "${STAGE}/"
          cp "dist/Open MakeAGIF (first run).command" "${STAGE}/"
          cp dist/README*.txt "${STAGE}/"
          # Drag-to-Applications shortcut. Must stay a symlink; if hdiutil
          # followed it, the image would contain the whole /Applications folder.
          ln -s /Applications "${STAGE}/Applications"
          if [[ ! -L "${STAGE}/Applications" ]]; then
            echo "Applications entry is not a symlink" >&2
            exit 1
          fi
          hdiutil create \
            -volname "MakeAGIF v${APP_VERSION}" \
            -srcfolder "${STAGE}" \
            -ov \
            -format UDZO \
            "${DMG_NAME}"
          rm -rf "${STAGE}"
          ls -lh "${DMG_NAME}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: MakeAGIF-v${{ env.APP_VERSION }}-macOS-arm64
          path: ${{ env.V3_DIR }}/${{ env.DMG_NAME }}
          retention-days: 90

      - name: Publish GitHub Release (permanent download link)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: MakeAGIF v${{ env.APP_VERSION }} — macOS Apple Silicon
          body: |
            Automated build from commit `${{ github.sha }}` (workflow run ${{ github.run_number }}).

            **Install:** open the DMG, drag `MakeAGIF v${{ env.APP_VERSION }}.app` onto the Applications shortcut, then double-click `Open MakeAGIF (first run).command` (clears the Gatekeeper quarantine flag and launches the app).

            Or, after copying the app to Applications, run `xattr -cr "/Applications/MakeAGIF v${{ env.APP_VERSION }}.app"` in Terminal.

            Full instructions are inside the DMG: `README - Install on Mac - ENGLISH.txt` and `README - Instalación en Mac - ESPAÑOL.txt`.

            Bundled tools (arm64): ffmpeg, ffprobe, gifski, img2webp (libwebp).
          files: ${{ env.V3_DIR }}/${{ env.DMG_NAME }}
          prerelease: true
          make_latest: true

      - name: Print download URLs
        run: |
          echo "Release page: https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}"
          echo "Direct DMG:   https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/${{ env.DMG_NAME }}"
